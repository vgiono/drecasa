<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DRE Casa</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- TOP BAR -->
    <div class="topbar">
      <div class="topbar-logo">DRE<span>Casa</span></div>
      <nav class="topbar-nav">
        <button class="nav-btn active" onclick="showPage('dre')">DRE</button>
        <button class="nav-btn" onclick="showPage('pix')">Pix</button>
        <button class="nav-btn" onclick="showPage('cartoes-tab')">Cartões</button>
        <button class="nav-btn" onclick="showPage('analise')">Análise</button>
        <button class="nav-btn" onclick="showPage('faturas')">Faturas</button>
      </nav>
      <div class="topbar-right">
        <div style="display:flex;align-items:center;gap:5px;margin-right:4px;" title="Tema">
          <span style="font-size:11px;color:var(--text3)">tema</span>
          <button onclick="setTheme('dark')"   title="Escuro"   class="theme-btn" style="background:#0e1117;"></button>
          <button onclick="setTheme('ocean')"  title="Oceano"   class="theme-btn" style="background:#1b2e42;"></button>
          <button onclick="setTheme('aurora')" title="Aurora"   class="theme-btn" style="background:#131f30;"></button>
          <button onclick="setTheme('plum')"   title="Ameixa"   class="theme-btn" style="background:#1e1330;"></button>
          <button onclick="setTheme('ember')"  title="Brasa"    class="theme-btn" style="background:#261508;"></button>
          <button onclick="setTheme('light')"  title="Claro"    class="theme-btn" style="background:#f0f4f8;"></button>
        </div>
        <span class="badge-save" id="badge-save">● Salvo</span>
        <button class="btn-small" onclick="exportJSON()">↓ Backup</button>
        <button class="btn-small" onclick="importJSON()">↑ Restaurar</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="doImport(event)">
        <button class="btn-small btn-danger" onclick="clearAllData()">⚠ Limpar</button>
      </div>
    </div>

    <div class="main">

      <!-- DRE -->
      <div class="page active" id="page-dre">
        <div class="summary-bar" id="dre-summary"></div>
        <div class="dre-controls">
          <div class="month-nav">
            <button class="mnav-btn" onclick="shiftView(-1)">‹</button>
            <span class="mnav-label" id="mnav-label"></span>
            <button class="mnav-btn" onclick="shiftView(1)">›</button>
          </div>
          <button class="btn-small" onclick="setVisibleCols(6)">6 meses</button>
          <button class="btn-small" onclick="setVisibleCols(12)">12 meses</button>
          <button class="btn-small" onclick="showAllMonths()">Todos</button>
          <button class="btn-small primary" onclick="addMonth()">+ Mês</button>
        </div>
        <div class="dre-wrap scrollbar">
          <table class="dre-table" id="dre-table"></table>
        </div>
      </div>

      <!-- PIX -->
      <div class="page" id="page-pix">
        <div class="pix-layout">
          <div class="pix-sidebar scrollbar" id="pix-sidebar"></div>
          <div class="pix-content scrollbar" id="pix-content"></div>
        </div>
      </div>

      <!-- ANÁLISE -->
      <div class="page" id="page-analise">
        <div class="analise-layout scrollbar">
          <div class="analise-grid" id="analise-grid"></div>
        </div>
      </div>

      <!-- CARTÕES / PARCELAMENTOS -->
      <div class="page" id="page-cartoes-tab">
        <div style="padding:14px 20px 10px;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
            <div>
              <div style="font-size:15px;font-weight:600;margin-bottom:2px;">Cartões &amp; Parcelamentos</div>
              <div style="font-size:12px;color:var(--text3)">Visão de todas as compras parceladas com projeção futura</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <span id="cf-count" style="font-size:12px;color:var(--text3)"></span>
              <button class="btn-small primary" onclick="showPage('faturas')">+ Carregar fatura</button>
            </div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;padding:8px 0;">
            <input id="cf-search" type="text" placeholder="Buscar..." oninput="renderCartoesParcelas()"
              style="padding:5px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;width:180px;font-family:var(--font);">
            <button class="btn-small" onclick="document.getElementById('cf-search').value='';renderCartoesParcelas();">✕</button>
          </div>
        </div>
        <div class="dre-wrap scrollbar" style="flex:1;padding:0 20px 20px;">
          <div id="cartoes-summary" style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:1rem;"></div>
          <table class="dre-table" id="cartoes-table" style="min-width:600px;margin-bottom:2rem;"></table>
        </div>
      </div>

      <!-- FATURAS -->
      <div class="page" id="page-faturas" style="overflow-y:auto;">
        <div id="ft-upload-wrap" style="padding:20px 20px 0;">
          <h1>💳 Analisador de Faturas <span>Itaú · até 3 cartões</span></h1>
          <div class="upload-zone" id="ft-drop-zone" onclick="document.getElementById('ft-file-input').click()">
            <div class="upload-icon">📂</div>
            <div class="upload-title">Arraste até 3 faturas aqui</div>
            <div class="upload-sub">ou clique para selecionar — .xlsx ou .csv do Itaú</div>
          </div>
          <input type="file" id="ft-file-input" accept=".xls,.xlsx,.csv" multiple style="display:none">
          <div class="file-list" id="ft-file-list"></div>
          <div class="btn-row">
            <button class="btn-primary" id="ft-btn-process" disabled onclick="ft_processAll()">Analisar faturas</button>
            <button class="btn-ai" id="ft-btn-ai" onclick="ft_classifyAllWithAI()">✦ Classificar com IA</button>
          </div>
          <div class="status" id="ft-status">
            <span class="spinner"></span>
            <span id="ft-status-msg"></span>
            <div class="progress-track" id="ft-progress-track" style="display:none"><div class="progress-fill" id="ft-progress-fill" style="width:0%"></div></div>
          </div>
          <button id="ft-back-btn" onclick="ft_resetUpload()" style="display:none;">← Nova análise</button>
        </div>
        <div id="ft-results" class="hidden" style="padding:20px;">
          <div class="metrics" id="ft-metrics"></div>
          <div class="tab-bar">
            <button class="tab active" onclick="ft_switchTab('cat')">Categorias</button>
            <button class="tab" onclick="ft_switchTab('visao')">Visão geral</button>
            <button class="tab" onclick="ft_switchTab('cartoes')">Por cartão</button>
            <button class="tab" onclick="ft_switchTab('revisar')">Revisar <span class="badge warn" id="ft-badge-revisar">0</span></button>
            <button class="tab" onclick="ft_switchTab('outros')">Outros</button>
            <button class="tab" onclick="ft_switchTab('lanc')">Lançamentos</button>
            <button class="tab" onclick="ft_switchTab('export')">Exportar</button>
          </div>
          <div id="ft-tabs"></div>
          <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn-primary" onclick="ft_sendToDRE()">✓ Enviar para DRE</button>
            <button class="btn-small" onclick="ft_sendAnalysis()">Chat com IA</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL DE CONFIRMAÇÃO -->
  <div id="modal-confirm" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button class="btn-small" onclick="closeModal()">Cancelar</button>
        <button class="btn-small primary" id="modal-confirm-btn" onclick="confirmModalAction()">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- MODAL DE ALERTA -->
  <div id="modal-alert" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="alert-title">Aviso</h2>
      </div>
      <div class="modal-body" id="alert-body"></div>
      <div class="modal-footer">
        <button class="btn-small primary" onclick="closeAlert()">OK</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
